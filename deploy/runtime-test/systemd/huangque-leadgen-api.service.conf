# /etc/systemd/system/huangque-leadgen-api.service
[Unit]
Description=Huangque 采集获客后端 (独立于 content_api)
After=network.target
[Service]
EnvironmentFile=/home/ubuntu/content-api/content.env
# HQ_INTERNAL_TOKEN 在 auth.env 里，退点要调 auth 的 /api/auth/points/refund 才能进 points_audit。
# content / imggen / admin 三个单元早就加载了它，唯独本单元没有 —— 补上（'-' 表示文件缺失不致启动失败）。
EnvironmentFile=-/home/ubuntu/auth-service/auth.env
WorkingDirectory=/home/ubuntu/content-api
ExecStart=/usr/bin/python3 /home/ubuntu/content-api/leadgen_api.py
Restart=always
User=ubuntu
[Install]
WantedBy=multi-user.target

# /etc/systemd/system/huangque-leadgen-api.service.d/hardening.conf
# huangque-leadgen-api 启动加固（崩溃风暴限速 + 抢占残留端口 + 优雅停机）
# 落地：/etc/systemd/system/huangque-leadgen-api.service.d/hardening.conf
# 部署后：sudo systemctl daemon-reload && sudo systemctl restart huangque-leadgen-api
#
# ExecStartPre 的 fuser 是给「上次没停干净、端口还被占着」兜底的：
# 前缀 '-' 表示失败不阻止启动；'|| true' 保证没有占用者时也返回 0。
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=8

[Service]
ExecStartPre=-/bin/sh -c 'fuser -k 8100/tcp 2>/dev/null || true'
KillMode=mixed
TimeoutStopSec=15
RestartSec=5

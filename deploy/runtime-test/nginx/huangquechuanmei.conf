server {
    server_name huangquechuanmei.com www.huangquechuanmei.com;

    root /var/www/huangquechuanmei;
    index index.html;
    charset utf-8;
    # 禁止外网访问备份文件(安全)
    location ~ \.bak { deny all; }
    location ^~ /feishu/ {
        proxy_pass http://127.0.0.1:8788/feishu/;
        proxy_http_version 1.1;
        proxy_connect_timeout 8s;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /admin-console {
        try_files $uri $uri/ /admin/index.html =404;
    }

    access_log /var/log/nginx/huangquechuanmei.access.log;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
    error_log  /var/log/nginx/huangquechuanmei.error.log;

    # 认证服务（独立 8095）
    location = /api/gen/dl {
        proxy_pass http://127.0.0.1:8097;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /api/gen/collect {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }
    location = /api/gen/collect/search {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }
    location = /api/gen/leads {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }

    location = /api/gen/banana/health {
        proxy_pass http://127.0.0.1:8101;
    }
    location = /api/gen/banana {
        proxy_pass http://127.0.0.1:8101;
        proxy_read_timeout 200s;
        client_max_body_size 20m;
    }

    # 提示词反推：也在 imggen(8101)，须精确路由，否则落到 ^~ /api/gen/ → content(8096) 404
    location = /api/gen/reverse {
        proxy_pass http://127.0.0.1:8101;
        client_max_body_size 20m;
        proxy_read_timeout 90s;
    }

    # 本地图片/视频提示词反推：原始文件流式转发，避免 200MB 视频进入 JSON/内存。
    location = /api/gen/breakdown/local-upload {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 320s;
        client_body_timeout 300s;
        client_max_body_size 200m;
    }
    location ^~ /api/gen/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 320s;
        proxy_buffering off;
        client_max_body_size 80m;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
    }

    # 获客后端 API（leadgen :8090）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # 老 leadgen 完整工具台
    location ^~ /leadgen/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # 干净 URL：/login → login.html；/ → index.html（不经 index 跳转，避免撞 .html 301）
    location ^~ /api-admin {
        auth_basic "黄雀 API 管理台（团队）";
    # REDACTED_EXTERNAL_TLS_OR_AUTH_PATH
        try_files $uri $uri/ $uri/index.html =404;
    }
    location ^~ /api-docs {
        auth_basic "黄雀 API 文档（团队）";
    # REDACTED_EXTERNAL_TLS_OR_AUTH_PATH
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = / {
        add_header Cache-Control "no-store" always;
        return 302 /workbench/inspiration;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 直接访问 *.html 一律 301 到无扩展名干净 URL
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    location ~* \.(webp|png|jpe?g|gif|mp4|css|js|json|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    # REDACTED_EXTERNAL_TLS_OR_AUTH_PATH
    # REDACTED_EXTERNAL_TLS_OR_AUTH_PATH
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.huangquechuanmei.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = huangquechuanmei.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name huangquechuanmei.com www.huangquechuanmei.com;
    return 404; # managed by Certbot
}

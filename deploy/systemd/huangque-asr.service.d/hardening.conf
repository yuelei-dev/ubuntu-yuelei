# huangque-asr 启动加固（崩溃风暴限速 + 抢占残留端口 + 优雅停机）
# 落地：/etc/systemd/system/huangque-asr.service.d/hardening.conf
# 部署后：sudo systemctl daemon-reload && sudo systemctl restart huangque-asr
#
# 与 huangque-imggen-api.service.d/hardening.conf 同款，仅端口换成 8102。
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=8

[Service]
ExecStartPre=-/bin/sh -c 'fuser -k 8102/tcp 2>/dev/null || true'
KillMode=mixed
TimeoutStopSec=15
RestartSec=5

# huangque-content 的 whisper 配置（F4 口播字幕用）
# 服务器落地路径：/etc/systemd/system/huangque-content.service.d/whisper.conf
#
# 部署合同（任一步失败都必须停止，不能重启服务）：
# sudo scripts/prepare_content_whisper_runtime.sh &&
# sudo systemctl daemon-reload &&
# sudo systemctl restart huangque-content
# 前置脚本以 root 预置目录，再以 ubuntu 下载并离线复核；只有全部成功后才会执行重启。
# 回滚代码/drop-in 时默认保留这个专用模型缓存；如确需清理，必须先证明
# 部署前该叶目录不存在，且只能清理 faster-whisper 叶目录，禁止删除父目录或其他缓存。
# 请求期间强制离线，避免首次生成临时下载或网络抖动拖垮付费链路。
[Service]
Environment=WHISPER_MODEL=small
Environment=WHISPER_DEVICE=cpu
Environment=WHISPER_COMPUTE_TYPE=int8
Environment=WHISPER_CACHE_DIR=/var/cache/huangque/faster-whisper
Environment="SUBTITLE_FONT=Noto Sans CJK SC"
Environment=HF_HUB_OFFLINE=1

# configuration file /etc/nginx/sites-enabled/leadgen:
upstream leadgen_pool {
    server 127.0.0.1:8091 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8092 max_fails=2 fail_timeout=10s;
}
server {
    include /etc/nginx/snippets/dify-leadgen;
    listen 8090;
    server_name _;
    client_max_body_size 50m;
    add_header X-Upstream $upstream_addr always;
    location /downloads/ {
        alias /var/www/downloads/;
        add_header Content-Disposition 'attachment';
    }
    location /images/ {
        alias /home/ubuntu/.openclaw-visual/media/outbound/;
        add_header Content-Disposition inline;
        add_header Access-Control-Allow-Origin "*";
    }

    location /xiaoshi-media/avatar-video/ {
        alias /var/www/xiaoshi-media/avatar-video/;
        add_header Content-Disposition inline;
        add_header Access-Control-Allow-Origin "*";
    }
    location = /dashboard { return 302 /dashboard/dashboard.html; }
    location = /dashboard/ { return 302 /dashboard/dashboard.html; }
    location /dashboard/ {
        alias /home/ubuntu/agent-metrics/web/;
        add_header Access-Control-Allow-Origin "*";
    }
    location / {
        proxy_pass http://leadgen_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

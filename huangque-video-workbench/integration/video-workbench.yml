name: Video Workbench

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "huangque-video-workbench/**"
      - ".github/workflows/video-workbench.yml"
  push:
    branches:
      - main
    paths:
      - "huangque-video-workbench/**"
      - ".github/workflows/video-workbench.yml"

defaults:
  run:
    working-directory: huangque-video-workbench

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: huangque
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: huangque
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huangque -d huangque"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_DATABASE_URL: postgresql://huangque:ci-postgres-password@127.0.0.1:5432/huangque
    steps:
      - name: Check out parent repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: huangque-video-workbench/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit and contract tests
        run: npm test

      - name: Run mandatory PostgreSQL integration tests
        run: npm run test:postgres-integration

      - name: Verify database migrations
        run: npm run db:verify

      - name: Validate production Compose
        run: docker compose -f infra/docker-compose.yml config
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          MINIO_ROOT_USER: ci-minio-user
          MINIO_ROOT_PASSWORD: ci-minio-password
          DATABASE_URL: postgresql://huangque:ci-postgres-password@postgres:5432/huangque
          HUANGQUE_AUTH_BASE: https://auth.invalid

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: huangque, POSTGRES_PASSWORD: localdev, POSTGRES_DB: huangque}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huangque -d huangque"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: localdev, MINIO_ROOT_PASSWORD: localdevsecret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://huangque:localdev@postgres:5432/huangque
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: npm run docker:api
    environment:
      DATABASE_URL: postgresql://huangque:localdev@postgres:5432/huangque
      REDIS_HOST: redis
      PORT: "4173"
    ports: ["4173:4173"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: npm run docker:worker
    environment:
      DATABASE_URL: postgresql://huangque:localdev@postgres:5432/huangque
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: localdev
      MINIO_SECRET_KEY: localdevsecret
      MINIO_BUCKET: huangque
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      HUANGQUE_CHROME_PATH: /usr/bin/chromium
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}

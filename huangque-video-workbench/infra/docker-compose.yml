services:
  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: huangque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: huangque
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huangque -d huangque"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: npm run db:migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be a complete percent-encoded PostgreSQL URL}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: npm run docker:api
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be a complete percent-encoded PostgreSQL URL}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: huangque
      HUANGQUE_AUTH_BASE: ${HUANGQUE_AUTH_BASE:?HUANGQUE_AUTH_BASE must be a complete reachable HTTPS URL}
      PORT: "4173"
    ports: ["127.0.0.1:4173:4173"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: npm run docker:worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be a complete percent-encoded PostgreSQL URL}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: huangque
      AVATAR_PROVIDER_ENDPOINT: ${AVATAR_PROVIDER_ENDPOINT:?AVATAR_PROVIDER_ENDPOINT must be an HTTPS URL}
      IMAGE_PROVIDER_ENDPOINT: ${IMAGE_PROVIDER_ENDPOINT:?IMAGE_PROVIDER_ENDPOINT must be an HTTPS URL}
      RENDER_PROVIDER_ENDPOINT: ${RENDER_PROVIDER_ENDPOINT:?RENDER_PROVIDER_ENDPOINT must be an HTTPS URL}
      PROVIDER_TOKEN: ${PROVIDER_TOKEN:?PROVIDER_TOKEN is required}
      PROVIDER_ALLOWED_MEDIA_ORIGINS: ${PROVIDER_ALLOWED_MEDIA_ORIGINS:?PROVIDER_ALLOWED_MEDIA_ORIGINS is required}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-120000}
      HUANGQUE_CHROME_PATH: /usr/bin/chromium
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_healthy}

volumes:
  postgres_data:
    name: huangque-video-workbench-postgres-data
  minio_data:
    name: huangque-video-workbench-minio-data

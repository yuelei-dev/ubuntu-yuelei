name: Test release impact gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-release-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base-verifier:
    name: Base-owned test release impact gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact trusted base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch Head as inert Git objects
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags \
            https://github.com/yuelei-dev/ubuntu-yuelei.git \
            "+refs/pull/$PR_NUMBER/head:refs/hq-review/pr-$PR_NUMBER"
          test "$(git rev-parse refs/hq-review/pr-$PR_NUMBER)" = "$EXPECTED_HEAD"
          test "$(git status --porcelain --untracked-files=normal)" = ""

      - name: Execute only the trusted base verifier
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git status --porcelain --untracked-files=normal)" = ""
          /usr/bin/python3 scripts/release_test.py check-impact \
            --source-root . \
            --base "$BASE_SHA" \
            --target "$EXPECTED_HEAD"

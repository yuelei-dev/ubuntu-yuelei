name: Test release impact gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-release-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base-verifier:
    name: Base-owned test release impact gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Mint the dedicated gate App token
        id: gate-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.TEST_RELEASE_GATE_APP_ID }}
          private-key: ${{ secrets.TEST_RELEASE_GATE_APP_PRIVATE_KEY }}
          owner: yuelei-dev
          repositories: ubuntu-yuelei
          permission-checks: write

      - name: Fetch Head as inert Git objects
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags \
            https://github.com/yuelei-dev/ubuntu-yuelei.git \
            "+refs/pull/$PR_NUMBER/head:refs/hq-review/pr-$PR_NUMBER"
          test "$(git rev-parse refs/hq-review/pr-$PR_NUMBER)" = "$EXPECTED_HEAD"
          test "$(git status --porcelain --untracked-files=normal)" = ""

      - name: Execute only the trusted base verifier
        id: verifier
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git status --porcelain --untracked-files=normal)" = ""
          /usr/bin/python3 -I -E -s -B scripts/release_test.py check-impact \
            --source-root . \
            --base "$BASE_SHA" \
            --target "$EXPECTED_HEAD"

      - name: Publish the trusted Head check from the dedicated App
        id: publish-head-check
        if: always() && steps.gate-app-token.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gate-app-token.outputs.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          VERIFIER_OUTCOME: ${{ steps.verifier.outcome }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          conclusion=failure
          summary="The Base-owned release verifier did not pass."
          if [ "$VERIFIER_OUTCOME" = success ]; then
            conclusion=success
            summary="The Base-owned release verifier passed for the exact PR Head."
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/yuelei-dev/ubuntu-yuelei/check-runs" \
            -f name='Trusted test release impact gate' \
            -f head_sha="$EXPECTED_HEAD" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f 'output[title]=Trusted test release impact gate' \
            -f "output[summary]=$summary" >/dev/null

      - name: Keep the workflow red unless verification and publication passed
        if: always()
        shell: bash
        env:
          VERIFIER_OUTCOME: ${{ steps.verifier.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish-head-check.outcome }}
        run: |
          set -Eeuo pipefail
          test "$VERIFIER_OUTCOME" = success
          test "$PUBLISH_OUTCOME" = success
